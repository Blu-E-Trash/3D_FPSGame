have_fun: false
ignore_patterns:
  - "Library/**"
  - "Temp/**"
  - "Logs/**"
  - "UserSettings/**"
  - "ProjectSettings/**"
  - "Packages/packages-lock.json"
  - "**/*.meta"
  - "**/*.unity"
  - "**/*.prefab"
  - "**/*.asset"
  - "**/*.mat"
  - "**/*.anim"
  - "**/*.controller"
  - "Assets/TutorialInfo/**"
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
